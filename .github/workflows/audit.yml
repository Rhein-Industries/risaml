name: Security Audit

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/audit.yml"
      - ".github/coordinated-stack.json"
      - ".github/scripts/setup-coordinated-stack.py"
  push:
    branches:
      - main
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/audit.yml"
      - ".github/coordinated-stack.json"
      - ".github/scripts/setup-coordinated-stack.py"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # This verified stable action is an immutable generated commit outside
      # the repository's default-branch history, as in the provider CI jobs.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # zizmor: ignore[impostor-commit,ref-version-mismatch]
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      # Run on the host so cargo-deny sees the same verified path patches and
      # pinned dependency graph as the compilation/test jobs.
      - name: Resolve pinned sibling review commits
        run: python .github/scripts/setup-coordinated-stack.py
      - name: Check RustCrypto dependency policy
        run: cargo deny --locked --no-default-features --features crypto-rustcrypto,crypto-legacy-algorithms,crypto-post-quantum,crypto-pkcs11 check
      - name: Check AWS-LC dependency policy
        run: cargo deny --locked --no-default-features --features crypto-aws-lc check
      - name: Check FIPS dependency policy
        run: cargo deny --locked --no-default-features --features crypto-fips check
