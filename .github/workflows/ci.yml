# risaml CI. Every job runs on GitHub-hosted runners and uses no repository
# secrets. Publishing is manual (see RELEASE.md): upstream saml-rs's
# release-plz workflow, which used crates.io trusted publishing configured for
# the saml-rs crate, is not part of the fork.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  feature-check:
    name: Feature check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo check -p risaml --no-default-features
      - run: cargo test -p risaml --no-default-features --test no_default_features
      - run: cargo test -p risaml --doc --no-default-features
      - run: RUSTDOCFLAGS="-D warnings -D missing_docs" cargo doc -p risaml --lib --no-deps --no-default-features

  provider-matrix:
    name: Crypto provider (${{ matrix.provider }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: rustcrypto
            features: crypto-rustcrypto,crypto-legacy-algorithms,crypto-post-quantum,crypto-pkcs11
          - provider: aws-lc
            features: crypto-aws-lc
          - provider: fips
            features: crypto-fips
    env:
      CRYPTO_PROVIDER_FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The stable action ref publishes immutable generated commits outside
      # the repository's default-branch history.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # zizmor: ignore[impostor-commit,ref-version-mismatch]
        with:
          components: clippy
      - name: Install AWS-LC native build dependencies
        if: matrix.provider != 'rustcrypto'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake clang libclang-dev perl pkg-config
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: matrix.provider == 'fips'
        with:
          go-version: stable
      # Keep the workspace's existing immutable v2 cache pin.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # zizmor: ignore[ref-version-mismatch]
      # The nextest action ref publishes immutable generated commits outside
      # the repository's default-branch history.
      - uses: taiki-e/install-action@cfdc41eb4dcb5a6d098e06c87a1e91076b799307 # zizmor: ignore[impostor-commit,ref-version-mismatch]
      - run: cargo check --workspace --locked --no-default-features --features "$CRYPTO_PROVIDER_FEATURES"
      - run: cargo clippy --workspace --locked --all-targets --no-default-features --features "$CRYPTO_PROVIDER_FEATURES" -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings -D missing_docs" cargo doc -p risaml --lib --no-deps --no-default-features --features "$CRYPTO_PROVIDER_FEATURES"
      - name: Run provider security regressions
        run: >-
          cargo nextest run -p risaml --locked
          --no-default-features --features "$CRYPTO_PROVIDER_FEATURES"
          --test provider_regression
          --test index_conformance
          --test typed_sso
          --test xsw
          --test metadata_signature
          --test metadata_trust
          --test external_slo_redirect
      - name: Run provider error propagation regression
        run: >-
          cargo nextest run -p risaml --locked
          --no-default-features --features "$CRYPTO_PROVIDER_FEATURES"
          --lib detached_verification_preserves_provider_error unloadable_peer

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.88.0
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@cfdc41eb4dcb5a6d098e06c87a1e91076b799307 # nextest
      - run: cargo nextest run -p risaml --locked
      - run: cargo test -p risaml --doc --locked

  # The upstream cargo-semver-checks job compared the package against its
  # latest crates.io release. risaml has no crates.io release yet, so there is
  # no baseline to compare against; restore the job (package: risaml) once
  # risaml 0.6.0 is published.

  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      # Abort the whole matrix as soon as one package fails.
      fail-fast: true
      matrix:
        package:
          - risaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@cfdc41eb4dcb5a6d098e06c87a1e91076b799307 # nextest
      - run: cargo nextest run -p ${{ matrix.package }}
      - run: cargo test -p ${{ matrix.package }} --doc
      - run: RUSTDOCFLAGS="-D warnings -D missing_docs" cargo doc -p ${{ matrix.package }} --lib --no-deps
      - run: cargo check -p ${{ matrix.package }} --examples
      - run: cargo run -p ${{ matrix.package }} --example sso
      - run: cargo run -p ${{ matrix.package }} --example slo

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs:
      - fmt
      - clippy
      - feature-check
      - provider-matrix
      - msrv
      - test
    if: always()
    steps:
      - name: Check required jobs
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
