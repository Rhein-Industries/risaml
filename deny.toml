[advisories]
ignore = [
    # Transitive through ribergshamra 0.10 / riptering 0.6's RSA dependency.
    # RustSec currently lists no safe upgrade; keep this explicit while
    # risaml's RustCrypto software RSA XML-Enc key transport path remains gated off by default.
    { id = "RUSTSEC-2023-0071", reason = "Transitive through ribergshamra/riptering RustCrypto RSA; no safe upgrade is currently available, and risaml gates that key-transport path by default." },
]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    # Required by aws-lc-fips-sys when the FIPS provider is selected.
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-workspace = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
